[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopbox"
version = "0.1.0"
description = "Local-first, E2B-protocol-compatible sandbox for macOS on Apple Silicon (M1-M5)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Loopbox Contributors" }]
keywords = ["sandbox", "e2b", "apple-silicon", "macos", "agent-runtime", "seatbelt", "virtualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
# Runtime uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
loopbox = "loopbox.cli:main"

[tool.setuptools.packages.find]
include = ["loopbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
